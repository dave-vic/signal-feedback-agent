<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark rounded square background -->
  <rect width="32" height="32" rx="6" fill="#111111"/>
  <!--
    4-pointed sparkle star.
    Each arm is a cubic bezier where both control points sit at the center (16,16),
    producing smooth concave sides.
    Points: top(16,4) → right(28,16) → bottom(16,28) → left(4,16) → top
  -->
  <path d="M 16 4
             C 16 16, 16 16, 28 16
             C 16 16, 16 16, 16 28
             C 16 16, 16 16, 4 16
             C 16 16, 16 16, 16 4
             Z"
        fill="#FFFFFF"/>
</svg>
